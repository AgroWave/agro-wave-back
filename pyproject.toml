[project]
name = "agrowave"
version = "0.1.0"
description = "AGROWAVE API: LPWAN uplink link simulator over FABDEM terrain in Colombia."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "boto3>=1.35",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.22",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "import-linter>=2.1",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agrowave"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
extend-select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D103"]       # el nombre con AC-xx basta en funciones de prueba
"migrations/**" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["agrowave"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "integration: requires the PostgreSQL and MinIO services from compose.yaml",
]