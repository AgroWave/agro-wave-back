name: agrowave

# Local development topology (baseline-architecture.md, budget of 4 containers):
# web, api, db and minio. Email goes to the api console; no extra container.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9000'"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    environment:
      # Bind mounts from Windows do not emit inotify events; poll for --reload.
      WATCHFILES_FORCE_POLLING: "true"
      FABDEM_CACHE_DIR: /var/cache/fabdem
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - fabdem-cache:/var/cache/fabdem
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ../agro-wave-front
      dockerfile: docker/web.Dockerfile
    environment:
      API_PROXY_TARGET: http://api:8000
      # Bind mounts from Windows do not emit file events; Vite polls instead.
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ../agro-wave-front:/app
      # Anonymous volume: keeps the Linux node_modules from the image, not the host one.
      - /app/node_modules
    depends_on:
      - api

volumes:
  db-data:
  minio-data:
  fabdem-cache:
